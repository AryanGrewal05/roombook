name: Pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install ruff && ruff check .

  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest booking/tests/unit

  integration:
    needs: [lint, unit]
    runs-on: ubuntu-24.04
    services:
      mongodb:
        image: mongo:8.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MONGODB_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python manage.py test booking.tests.integration

  package:
    needs: integration
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: git archive --format=tar.gz -o roombook-${{ github.sha }}.tar.gz HEAD
      - uses: actions/upload-artifact@v7
        with:
          name: roombook-${{ github.sha }}
          path: roombook-${{ github.sha }}.tar.gz

  deploy-staging:
    needs: package
    runs-on: ubuntu-24.04
    environment: staging
    steps:
      - uses: actions/download-artifact@v8
        with: { name: "roombook-${{ github.sha }}" }
      - run: echo "deploy roombook-${{ github.sha }} to staging"

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v8
        with: { name: "roombook-${{ github.sha }}" }
      - run: echo "deploy the SAME artifact to production"
